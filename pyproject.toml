[build-system]
requires = ["setuptools>=68.0", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msbench"
version = "0.1.0"
description = "A Python-first developer toolkit for triangle-splatting-style radiance field research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "MeshSplatBench Contributors"},
]
keywords = ["3D reconstruction", "triangle splatting", "radiance fields", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "Pillow",
    "imageio[ffmpeg]",
    "opencv-python",
    "scipy",
    "trimesh",
    "pytorch-msssim",
    "lpips",
    "plyfile",
    "typer>=0.9",
    "pyyaml",
    "rich",
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
cuda = [
    "nanobind>=2.11.0",
    "cmake>=3.20",
    "ninja",
]

[project.scripts]
msbench = "msbench.cli.main:app"

[project.entry-points."msbench.adapters"]
d2ts = "msbench.renderers.d2ts_adapter"
triangle_splatting = "msbench.renderers.triangle_splatting_adapter"
mesh_splatting = "msbench.renderers.mesh_splatting_adapter"
diffsoup = "msbench.renderers.diffsoup_adapter"

[project.entry-points."msbench.training_methods"]
triangle_splatting = "msbench.trainers.triangle_splatting_method"
diffsoup = "msbench.trainers.diffsoup_native"

[tool.setuptools.packages.find]
include = ["msbench*"]
exclude = [
    "*.__pycache__",
    "*.__pycache__.*",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["msbench/tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

