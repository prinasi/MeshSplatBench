# @format

experiment:
  name: triangle_splatting_colmap

dataset:
  type: colmap
  root: data/mipnerf360/bicycle
  image_dir: images
  resolution: 4
  eval_every: 8
  eval_split: true

trainer:
  type: triangle-splatting
  max_steps: 30000
  white_background: false
  densify_until_iter: 15000

loop:
  log_interval: 100
  eval_interval: 1000
  save_interval: 5000

adapter:
  type: triangle-splatting
  checkpoint: outputs/triangle-splatting/mipnerf360/bicycle

render:
  split: test
  save_gt: false
  save_renders: true
  save_aux: false
  metrics: false
  video:
    split: train
    output_dir: outputs/triangle-splatting/mipnerf360/bicycle/video
    frames: 240
    fps: 30
    zoom: 1.0
    z_variation: 0.0
    z_phase: 0.0
  viewer:
    split: test
    host: 127.0.0.1
    port: 7007

eval:
  split: test
  save_renders: true
  render_dir: outputs/triangle-splatting/mipnerf360/bicycle/test_metrics
  chamfer:
    samples: 500000
  dtu_mesh:
    samples: 500000

metrics:
  - type: psnr
  - type: ssim
  - type: lpips

profile:
  split: test
  repeats: 100
  output: outputs/triangle-splatting/mipnerf360/bicycle/profile.json

mesh:
  output: outputs/triangle-splatting/mipnerf360/bicycle/mesh.ply

inspect:
  output: outputs/triangle-splatting/mipnerf360/bicycle/stats.json

output:
  dir: outputs/triangle-splatting/mipnerf360/bicycle
  metrics_file: outputs/triangle-splatting/mipnerf360/bicycle/metrics.json
  mesh_file: outputs/triangle-splatting/mipnerf360/bicycle/mesh.ply
  stats_file: outputs/triangle-splatting/mipnerf360/bicycle/stats.json
  report_file: outputs/triangle-splatting/mipnerf360/bicycle/report.md
