# @format

_base_:
  - ../../base/mipnerf360.yaml
  - ../../base/triangle-splatting.yaml

experiment:
  name: triangle_splatting_bonsai

dataset:
  scene: bonsai
  image_dir: images_2
  resolution: 1

trainer:
  importance_threshold: 0.025
  lr_sigma: 0.0008
  opacity_lr: 0.014
  lambda_normals: 0.00004
  lambda_dist: 1
  iteration_mesh: 5000
  lambda_opacity: 0.0055
  lambda_dssim: 0.4
  lr_triangles_points_init: 0.0015
  lambda_size: 5e-8
