# @format

trainer:
  type: 2dts
  max_steps: 30000

adapter:
  type: 2dts
  checkpoint: outputs/{method}/{dataset}/{scene}/ckpt
  render_params:
    gamma_rescale: true
    ste_threshold: null
    sort_level: 0
    bg_color: white

dataset:
  resolution_rounding: floor

output:
  dir: outputs/{method}/{dataset}/{scene}
  metrics_file: outputs/{method}/{dataset}/{scene}/metrics.json
  mesh_metrics_file: outputs/{method}/{dataset}/{scene}/mesh_metrics.json
  stats_file: outputs/{method}/{dataset}/{scene}/stats.json
  report_file: outputs/{method}/{dataset}/{scene}/report.md

d2ts:
  clean_output_dir: false
  use_tensorboard: true
  # Set verbose: true to enable full 2dts training output (console logs,
  # TensorBoard, training/eval image saves).  Defaults to false so that
  # only the final checkpoint is kept during benchmark runs.
  verbose: false
  native_overrides:
    trainer:
      # TriBench computes final NVS metrics after rendering; native full-res LPIPS eval
      # can OOM on large MipNeRF360 scenes during training.
      eval_interval_iter: 0
