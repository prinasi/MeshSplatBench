# @format

dataset:
  image_dir: images
  resolution: -1
  eval_every: 8
  eval_split: true

loop:
  log_interval: 1000
  eval_interval: 1000
  save_interval: 5000

render:
  split: test
  save_gt: false
  save_renders: true
  save_aux: false
  metrics: false
  video:
    split: train
    output_dir: outputs/{method}/{dataset}/{scene}/video
    frames: 240
    fps: 30
    zoom: 1.0
    z_variation: 0.0
    z_phase: 0.0
  viewer:
    split: test
    host: 127.0.0.1
    port: 7007

eval:
  split: test
  save_renders: true
  render_dir: outputs/{method}/{dataset}/{scene}/test_metrics
  chamfer:
    samples: 500000
  dtu_mesh:
    samples: 500000

metrics:
  - type: psnr
  - type: ssim
  - type: lpips

profile:
  split: test
  repeats: 100
  output: outputs/{method}/{dataset}/{scene}/profile.json

mesh:
  output: outputs/{method}/{dataset}/{scene}/mesh.ply

inspect:
  output: outputs/{method}/{dataset}/{scene}/stats.json

output:
  dir: outputs/{method}/{dataset}/{scene}
  metrics_file: outputs/{method}/{dataset}/{scene}/metrics.json
  mesh_file: outputs/{method}/{dataset}/{scene}/mesh.ply
  stats_file: outputs/{method}/{dataset}/{scene}/stats.json
  report_file: outputs/{method}/{dataset}/{scene}/report.md
