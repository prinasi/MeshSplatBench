# @format

_base_: _base_.yaml

dataset:
  name: dtu
  type: dtu
  root: data/dtu
  image_dir: images
  resolution: 2
  eval_every: 8

trainer:
  white_background: true
  depth_ratio: 1.0
  lambda_normals: 0.0028
  lambda_dist: 0.014
  iteration_mesh: 25000
  lambda_opacity: 0.0044
  importance_threshold: 0.027
  lr_triangles_points_init: 0.0015
  lambda_size: 0.0
  no_dome: true

adapter:
  render_params:
    bg_color: white

mesh:
  output: outputs/{method}/{dataset}/{scene}/fuse_post.ply
  split: train
  voxel_size: 0.004
  sdf_trunc: 0.016
  depth_trunc: 3.0
  num_cluster: 1
  depth_ratio: 1.0

output:
  mesh_file: outputs/{method}/{dataset}/{scene}/fuse_post.ply
