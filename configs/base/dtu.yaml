# @format

_base_: _base_.yaml

dataset:
  name: dtu
  type: dtu
  root: data/dtu
  image_dir: images
  resolution: 2
  eval_every: 8
  # "foreground" also enables foreground training and white render background by default.
  dtu_eval_mode: foreground # "full" (Mode A) or "foreground" (Mode B)

trainer:
  white_background: false
  depth_ratio: 1.0
  lambda_normals: 0.0028
  lambda_dist: 0.014
  iteration_mesh: 25000
  lambda_opacity: 0.0044
  importance_threshold: 0.027
  lr_triangles_points_init: 0.0015
  lambda_size: 0.0
  no_dome: true

adapter:
  render_params:
    # Overridden to white automatically when dataset.dtu_eval_mode is foreground.
    bg_color: black

mesh:
  output: outputs/{method}/{dataset}/{scene}/mesh/fuse_post.ply
  split: train
  voxel_size: 0.004
  sdf_trunc: 0.016
  depth_trunc: 3.0
  num_cluster: 1
  depth_ratio: 1.0

output:
  mesh_file: outputs/{method}/{dataset}/{scene}/mesh/fuse_post.ply
